global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: taskpilot-api
    metrics_path: /api/v1/metrics
    # METRICS_TOKEN from .env.production, written to deployment/monitoring/metrics_token (mode 0400).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
