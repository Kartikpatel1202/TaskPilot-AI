# Redis for TaskPilot AI: queue, locks, rate limits. Private network only; password set via --requirepass.
bind 0.0.0.0
protected-mode yes
port 6379

# Durability: the queue must survive a Redis restart (at-least-once delivery).
appendonly yes
appendfsync everysec
save 900 1
save 300 10

# Bounded memory. noeviction: never silently drop queued jobs or locks — writes fail loudly instead.
maxmemory 384mb
maxmemory-policy noeviction

# Disable dangerous commands for the application user.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

timeout 300
tcp-keepalive 60
maxclients 1000
loglevel notice
