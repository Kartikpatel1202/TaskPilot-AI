# TaskPilot AI egress proxy — the ONLY route from the api container to the internet.
# Enforces the SSRF policy at the network layer, after DNS resolution (dst ACLs are checked against the resolved IP),
# which defeats DNS rebinding and encoded-IP tricks that bypass application-level checks.

http_port 3128

# Never forward to internal, loopback, link-local (incl. cloud metadata 169.254.169.254) or reserved ranges.
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dst dst ff00::/8

# Only standard web ports.
acl web_ports port 80 443
acl CONNECT method CONNECT
acl ssl_ports port 443

# Only the api container's egress network may use the proxy.
acl taskpilot_api src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

http_access deny blocked_dst
http_access deny !web_ports
http_access deny CONNECT !ssl_ports
http_access allow taskpilot_api
http_access deny all

# No caching of user content; no identifying forwarding headers.
cache deny all
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all

# Resolve once per request and check the result (dst ACLs above apply to the resolved address).
dns_v4_first on
positive_dns_ttl 60 seconds
negative_dns_ttl 10 seconds

# Bounded resources.
request_body_max_size 25 MB
reply_body_max_size 200 MB
connect_timeout 15 seconds
read_timeout 60 seconds

access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename /var/run/squid.pid
