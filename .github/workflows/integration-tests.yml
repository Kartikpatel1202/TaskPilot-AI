name: integration-tests

# PostgreSQL + Redis + production compose validation. Runs on main and on demand (slower than unit CI).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskpilot
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U taskpilot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      APP_ENV: test
      TASKPILOT_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Alembic upgrade / check / downgrade / upgrade on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://taskpilot:ci-only-password@localhost:5432/taskpilot
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      # The test suites use in-memory SQLite; PostgreSQL coverage here is the migration round-trip above.
      - name: Resilience + security suites against real Redis
        run: python -m pytest tests/resilience tests/security -q

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: |
          cp deployment/.env.production.example deployment/.env.production
          touch deployment/monitoring/metrics_token
          docker compose -f deployment/docker-compose.prod.yml --env-file deployment/.env.production config --quiet
      - name: Build images
        run: docker compose -f deployment/docker-compose.prod.yml --env-file deployment/.env.production build
