name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      APP_ENV: test
      TASKPILOT_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Migrations apply cleanly (SQLite)
        run: |
          mkdir -p runtime
          DATABASE_URL=sqlite+aiosqlite:///./runtime/ci.db python -m alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./runtime/ci.db python -m alembic check
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
