<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Dynamic — TaskPilot Demo Shop</title></head>
<body>
  <h1>Slow-loading search</h1>
  <div id="slot"></div>
  <script>
    // The search box appears late, and its accessible label changes after it appears.
    setTimeout(() => {
      document.getElementById("slot").innerHTML =
        '<input id="dq" type="search" aria-label="Search products" placeholder="Type to search" />';
      setTimeout(() => document.getElementById("dq").setAttribute("aria-label", "Find items in the shop"), 150);
    }, 700);
  </script>
</body>
</html>
