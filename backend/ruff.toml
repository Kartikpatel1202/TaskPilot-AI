target-version = "py311"
line-length = 140

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Pytest fixtures are imported into test modules by name (F811) and the Phase 3 fixture-site block
# in conftest.py intentionally imports mid-file (E402).
"tests/**" = ["F811"]
"tests/conftest.py" = ["E402"]
