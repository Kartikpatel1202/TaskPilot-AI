# Local development stack (Phase 1). Uses stock images + bind mounts; no secrets.
# Usage: docker compose up
services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-venv:/venv
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: http://localhost:3000
      ENABLE_DEMO_ENDPOINTS: "true"
    command: >
      sh -c "python -m venv /venv && /venv/bin/pip install -q -r requirements.txt &&
             /venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      # The browser connects to these, so they point at the host-published port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-venv:
  frontend-node-modules:
